name: Sync league standings, schedule & results

on:
  # Runs automatically every day.
  schedule:
    - cron: '0 13 * * *'   # 13:00 UTC ≈ 6-7am Mountain time, adjust as you like
  # Lets you trigger it manually: repo → Actions tab → this workflow → "Run workflow".
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install cheerio

      - name: Run the sync script
        run: node scripts/sync-league-data.js
