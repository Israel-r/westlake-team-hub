<style>
  :root{
    --field-dark:#071B3B;   /* Westlake navy */
    --field:#0F2E57;        /* Westlake navy, lighter */
    --field-line:#2A4E7C;   /* navy line/divider */
    --chalk:#F6F7F9;        /* silver-white */
    --chalk-dim:#E3E7EC;    /* silver */
    --gold:#FFC72C;         /* Vegas gold */
    --gold-dim:#E0A80F;
    --rust:#2D6CA6;         /* Carolina blue accent */
    --ink:#10171F;
    --ink-soft:#52606D;
    --line-on-dark:rgba(255,255,255,0.14);
    --error:#D64545;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--chalk);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Anton',sans-serif;
    font-weight:400;
    letter-spacing:0.5px;
    text-transform:uppercase;
  }
  .mono{font-family:'Space Mono',monospace;}
  a{color:inherit;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- GATE / SETUP ---------- */
  .gate-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 50% 0%, var(--field) 0%, var(--field-dark) 65%);
    padding:24px;
  }
  .gate-card{
    background:var(--chalk);
    border-radius:4px;
    width:100%;max-width:420px;
    padding:36px 32px 32px;
    box-shadow:0 30px 60px rgba(0,0,0,0.4);
    position:relative;
    overflow:hidden;
  }
  .gate-card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:8px;
    background:repeating-linear-gradient(90deg,var(--gold) 0 18px, transparent 18px 26px);
  }
  .gate-eyebrow{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:2px;color:var(--rust);text-transform:uppercase;margin-bottom:6px;}
  .gate-card h1{font-size:34px;margin:0 0 18px;color:var(--field-dark);}
  .field-group{margin-bottom:14px;}
  .field-group label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);margin-bottom:5px;}
  .field-group input, .field-group textarea, .field-group select{
    width:100%;padding:11px 12px;border:2px solid #D7DCE2;border-radius:3px;
    font-family:'Inter',sans-serif;font-size:15px;background:#fff;color:var(--ink);
  }
  .field-group input:focus, .field-group textarea:focus, .field-group select:focus{outline:none;border-color:var(--field);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 20px;border-radius:3px;border:none;font-weight:700;
    text-transform:uppercase;letter-spacing:1px;font-size:13px;
    transition:transform .12s ease, background .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--rust);color:#fff;width:100%;}
  .btn-primary:hover{background:#a83a0c;}
  .btn-gold{background:var(--gold);color:var(--field-dark);}
  .btn-gold:hover{background:var(--gold-dim);}
  .btn-outline{background:transparent;border:2px solid var(--field-line);color:var(--chalk);}
  .btn-outline:hover{background:var(--line-on-dark);}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:2px solid #D7DCE2;}
  .btn-ghost:hover{border-color:var(--ink-soft);}
  .btn-small{padding:7px 12px;font-size:11px;}
  .gate-error{color:var(--error);font-size:13px;font-weight:600;margin-bottom:12px;}
  .gate-foot{margin-top:16px;font-size:12px;color:var(--ink-soft);text-align:center;}

  /* ---------- NAV / YARD LINE BAR ---------- */
  header.top{
    background:var(--field-dark);
    color:var(--chalk);
    position:sticky;top:0;z-index:40;
    box-shadow:0 2px 12px rgba(0,0,0,0.25);
  }
  .top-bar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 22px;max-width:1180px;margin:0 auto;gap:16px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .dot{width:10px;height:10px;background:var(--gold);border-radius:50%;}
  .brand h1{font-size:20px;margin:0;color:var(--chalk);letter-spacing:1px;}
  .top-actions{display:flex;gap:10px;align-items:center;}
  .admin-pill{
    font-family:'Space Mono',monospace;font-size:11px;background:var(--gold);color:var(--field-dark);
    padding:5px 10px;border-radius:20px;font-weight:700;letter-spacing:0.5px;
  }
  nav.yardline{
    background:var(--field);
    border-top:1px solid var(--line-on-dark);
    border-bottom:1px solid var(--line-on-dark);
    overflow-x:auto;
  }
  .yardline-inner{
    max-width:1180px;margin:0 auto;display:flex;
  }
  .yard-tab{
    flex:1;min-width:110px;text-align:center;padding:13px 8px 11px;
    font-family:'Space Mono',monospace;font-size:12px;letter-spacing:1.5px;
    text-transform:uppercase;color:#9FB3C8;background:none;border:none;
    border-right:1px solid var(--field-line);
    border-bottom:3px solid transparent;position:relative;font-weight:700;
  }
  .yard-tab:last-child{border-right:none;}
  .yard-tab:hover{color:var(--chalk);}
  .yard-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
  .yard-tab.active::after{
    content:"\1F3C8";position:absolute;top:-2px;left:50%;transform:translateX(-50%) scale(0.8);
    font-size:14px;
  }

  main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:28px 22px 70px;}

  /* ---------- SCOREBOARD HERO ---------- */
  .scoreboard{
    background:var(--field-dark);
    border-radius:6px;
    padding:26px 26px 22px;
    color:var(--chalk);
    display:grid;grid-template-columns:1.3fr 1fr;gap:24px;
    margin-bottom:26px;
    box-shadow:0 20px 50px rgba(13,31,23,0.35);
    position:relative;
    overflow:hidden;
  }
  .scoreboard::before{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,0.02) 3px 4px);
    pointer-events:none;
  }
  @media (max-width:720px){.scoreboard{grid-template-columns:1fr;}}
  .sb-eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;}
  .sb-team{font-size:38px;margin:4px 0 14px;}
  .sb-tiles{display:flex;gap:10px;flex-wrap:wrap;}
  .sb-tile{background:rgba(255,255,255,0.06);border:1px solid var(--line-on-dark);border-radius:4px;padding:10px 16px;min-width:90px;}
  .sb-tile .k{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1.5px;color:#9fb3a8;text-transform:uppercase;}
  .sb-tile .v{font-family:'Anton',sans-serif;font-size:24px;color:var(--chalk);}
  .sb-next{background:rgba(0,0,0,0.25);border-radius:4px;padding:16px 18px;display:flex;flex-direction:column;justify-content:center;}
  .sb-next-item.secondary{padding-top:12px;border-top:1px solid var(--line-on-dark);}
  .sb-next .k{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:6px;}
  .sb-next-item.secondary .k{font-size:10px;margin-bottom:4px;}
  .sb-next .opp{font-size:24px;margin:0 0 4px;}
  .sb-next-item.secondary .opp{font-size:17px;margin:0 0 3px;}
  .sb-next .meta{font-size:13px;color:#c7d6cd;font-family:'Space Mono',monospace;}
  .sb-next-item.secondary .meta{font-size:11.5px;}
  .sb-empty{color:#9fb3a8;font-size:14px;}

  /* ---------- SECTIONS/CARDS ---------- */
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 14px;gap:12px;flex-wrap:wrap;}
  .section-head h2{font-size:24px;color:var(--field-dark);margin:0;}
  .section-head .sub{font-family:'Space Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(230px,1fr));gap:14px;margin-bottom:32px;}
  .link-card{
    background:#fff;border:2px solid #E3E7EC;border-radius:4px;padding:18px;
    display:flex;flex-direction:column;gap:8px;text-decoration:none;transition:border-color .15s;
  }
  .link-card:hover{border-color:var(--gold);}
  .link-card .lc-label{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1.5px;color:var(--rust);text-transform:uppercase;}
  .link-card .lc-title{font-family:'Anton',sans-serif;font-size:18px;color:var(--field-dark);text-transform:uppercase;}
  .link-card .lc-arrow{align-self:flex-end;font-size:18px;color:var(--gold);}

  .pos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:10px;}
  @media (max-width:820px){.pos-grid{grid-template-columns:1fr;}}
  .pos-card{background:#fff;border:2px solid #E3E7EC;border-radius:4px;padding:18px;text-decoration:none;display:block;cursor:pointer;}
  .pos-card:hover{border-color:var(--field);}
  .pos-card .pc-eyebrow{font-family:'Space Mono',monospace;font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:1px;}
  .pos-card h3{margin:4px 0 8px;font-size:20px;color:var(--field-dark);}
  .pos-card p{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.5;}

  /* ---------- CALENDAR ---------- */
  .cal-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .cal-month{font-size:22px;color:var(--field-dark);min-width:200px;}
  .cal-nav{display:flex;gap:8px;}
  .cal-nav button{background:var(--field);color:#fff;border:none;border-radius:3px;width:34px;height:34px;font-size:16px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:26px;}
  .cal-dow{font-family:'Space Mono',monospace;font-size:11px;text-align:center;color:var(--ink-soft);padding-bottom:4px;text-transform:uppercase;}
  .cal-cell{
    min-height:82px;background:#fff;border:1px solid #E3E7EC;border-radius:3px;padding:6px;
    display:flex;flex-direction:column;gap:3px;font-size:12px;
  }
  .cal-cell.empty{background:transparent;border:none;}
  .cal-cell.today{border:2px solid var(--gold);}
  .cal-daynum{font-family:'Space Mono',monospace;font-weight:700;color:var(--ink-soft);}
  .cal-evt{
    font-size:10.5px;padding:2px 5px;border-radius:2px;color:#fff;line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;
  }
  .cal-evt.game{background:var(--gold);color:var(--field-dark);}
  .cal-evt.practice{background:var(--field);}
  .upcoming-list{display:flex;flex-direction:column;gap:8px;}
  .upcoming-row{
    display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #E3E7EC;border-radius:4px;padding:12px 14px;
  }
  .upcoming-date{
    font-family:'Space Mono',monospace;text-align:center;min-width:56px;background:var(--field-dark);color:#fff;border-radius:3px;padding:6px 4px;
  }
  .upcoming-date .d{font-family:'Anton',sans-serif;font-size:18px;line-height:1;}
  .upcoming-date .m{font-size:10px;letter-spacing:1px;text-transform:uppercase;}
  .upcoming-info{flex:1;}
  .upcoming-info .t{font-weight:700;color:var(--field-dark);}
  .upcoming-info .s{font-size:12px;color:var(--ink-soft);font-family:'Space Mono',monospace;}
  .tag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;padding:2px 7px;border-radius:10px;color:#fff;}
  .tag.game{background:var(--gold);color:var(--field-dark);}
  .tag.practice{background:var(--field);}
  .row-actions{display:flex;gap:6px;}
  .icon-btn{background:none;border:none;font-size:15px;color:var(--ink-soft);padding:4px;border-radius:3px;}
  .icon-btn:hover{color:var(--rust);background:#EAF1F8;}

  /* ---------- POSITION PAGE ---------- */
  .week-card{background:#fff;border:2px solid #E3E7EC;border-radius:5px;padding:22px 24px;margin-bottom:20px;}
  .week-card .wk-eyebrow{font-family:'Space Mono',monospace;font-size:11px;color:var(--rust);letter-spacing:1.5px;text-transform:uppercase;}
  .week-card h2{margin:2px 0 16px;font-size:26px;color:var(--field-dark);}
  .wk-block{margin-bottom:16px;}
  .wk-block h4{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-soft);margin:0 0 6px;}
  .wk-block p, .wk-block li{font-size:14.5px;line-height:1.6;color:var(--ink);}
  .wk-block ul{margin:0;padding-left:18px;}
  .video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
  .video-box{background:var(--field-dark);border-radius:4px;overflow:hidden;}
  .video-box iframe, .video-box video{width:100%;aspect-ratio:16/9;border:none;display:block;}
  .image-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;}
  .image-grid a{display:block;border-radius:4px;overflow:hidden;border:1px solid #E3E7EC;}
  .image-grid img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;transition:transform .15s;}
  .image-grid a:hover img{transform:scale(1.04);}
  .img-broken{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:12px;color:var(--ink-soft);background:var(--chalk-dim);}
  .video-title{color:var(--chalk);font-size:12px;padding:8px 10px;font-family:'Space Mono',monospace;}
  .plink{display:inline-flex;align-items:center;gap:6px;background:var(--chalk-dim);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;margin:0 6px 6px 0;text-decoration:none;color:var(--field-dark);}
  .plink:hover{background:var(--gold);}
  .archive-toggle{background:none;border:none;color:var(--ink-soft);font-size:13px;font-weight:700;text-decoration:underline;padding:0;margin-bottom:14px;}
  .archive-item{border-left:3px solid #E3E7EC;padding:10px 0 10px 14px;margin-bottom:8px;}
  .archive-item summary{cursor:pointer;font-weight:700;color:var(--field-dark);}

  /* ---------- SCOUTING REPORT ---------- */
  .scout-subtabs{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap;}
  .scout-subtab{
    padding:9px 18px;border-radius:20px;border:2px solid #D7DCE2;background:#fff;
    font-family:'Space Mono',monospace;font-size:12px;letter-spacing:1px;text-transform:uppercase;
    font-weight:700;color:var(--ink-soft);
  }
  .scout-subtab.active{background:var(--field-dark);border-color:var(--field-dark);color:var(--gold);}
  .stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px;}
  .stat-card{background:var(--chalk-dim);border-left:4px solid var(--gold);border-radius:3px;padding:12px 14px;}
  .stat-label{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px;}
  .stat-val{font-size:19px;font-weight:800;color:var(--field-dark);}
  .stat-sub{font-family:'Space Mono',monospace;font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .bar-row{display:grid;grid-template-columns:150px 1fr 90px;align-items:center;gap:10px;margin-bottom:8px;}
  .bar-label{font-size:13px;font-weight:700;color:var(--field-dark);}
  .bar-track{background:var(--chalk-dim);border-radius:3px;height:16px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:3px;}
  .bar-value{font-family:'Space Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .bar-pct{color:#9AA7B4;}
  .stacked-row{display:grid;grid-template-columns:80px 1fr 34px;align-items:center;gap:10px;margin-bottom:7px;}
  .stacked-label{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:var(--field-dark);}
  .stacked-track{display:flex;height:16px;border-radius:3px;overflow:hidden;background:var(--chalk-dim);}
  .stacked-seg{height:100%;}
  .stacked-total{font-family:'Space Mono',monospace;font-size:11px;color:var(--ink-soft);text-align:right;}
  .scout-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;}
  .scout-legend-item{font-family:'Space Mono',monospace;font-size:11px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:5px;}
  .scout-legend-dot{width:9px;height:9px;border-radius:2px;display:inline-block;}
  .keys-list{margin:0;padding-left:18px;}
  .keys-list li{font-size:14.5px;line-height:1.7;color:var(--ink);margin-bottom:4px;}
  .player-notes{margin-top:10px;display:flex;flex-direction:column;gap:10px;}
  .player-note-row{background:var(--chalk-dim);border-left:3px solid var(--gold);border-radius:3px;padding:9px 12px;}
  .player-note-num{font-family:'Space Mono',monospace;font-weight:800;color:var(--field-dark);margin-right:8px;}
  .player-note-role{font-family:'Space Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .player-note-text{font-size:13.5px;line-height:1.55;color:var(--ink);margin-top:4px;}
  .rp-grid{display:grid;grid-template-columns:100px 1fr 1fr;gap:8px;align-items:center;margin-bottom:6px;}
  .rp-head{font-family:'Space Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);}
  .rp-down{font-size:13px;font-weight:700;color:var(--field-dark);}
  @media (max-width:560px){
    .bar-row{grid-template-columns:100px 1fr 70px;}
    .stat-strip{grid-template-columns:repeat(2,1fr);}
  }
  .empty-state{background:#fff;border:2px dashed #D7DCE2;border-radius:5px;padding:34px;text-align:center;color:var(--ink-soft);}

  /* ---------- PREDICTIONS ---------- */
  .pred-disclaimer{background:var(--chalk-dim);border-left:4px solid var(--gold);border-radius:3px;padding:11px 14px;font-size:13px;color:var(--ink-soft);margin-bottom:20px;}
  .pred-card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:8px;}
  .pred-card{background:#fff;border:1px solid #D7DCE2;border-radius:5px;padding:14px 16px;}
  .pred-card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .pred-teams{font-weight:800;color:var(--field-dark);}
  .pred-vs{font-family:'Space Mono',monospace;font-size:11px;color:var(--ink-soft);margin:0 4px;}
  .pred-date{font-family:'Space Mono',monospace;font-size:11px;color:var(--ink-soft);}
  .pred-bar-row{margin:8px 0 6px;}
  .pred-bar-track{background:var(--chalk-dim);border-radius:3px;height:14px;overflow:hidden;}
  .pred-bar-fill{height:100%;background:var(--rust);border-radius:3px;}
  .pred-pct-row{display:flex;justify-content:space-between;font-family:'Space Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .pred-pct-row .pred-fav{color:var(--field-dark);font-weight:800;}
  .pred-margin{font-family:'Space Mono',monospace;font-size:11.5px;color:var(--ink-soft);margin-top:6px;}
  .rank-table{width:100%;border-collapse:collapse;background:#fff;border-radius:5px;overflow:hidden;font-size:13.5px;margin-bottom:8px;}
  .rank-table th{background:var(--field-dark);color:var(--chalk);text-align:left;padding:9px 12px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;}
  .rank-table td{padding:8px 12px;border-bottom:1px solid #EDEFF2;}
  .rank-row-us{background:#FFF8E6;}
  .rank-us-tag{font-family:'Space Mono',monospace;font-size:9px;background:var(--gold);color:var(--field-dark);padding:1px 5px;border-radius:3px;font-weight:800;margin-left:4px;}
  .matchup-explorer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid #D7DCE2;border-radius:5px;padding:12px 14px;margin-bottom:8px;}
  .matchup-explorer select{padding:9px 10px;flex:1;min-width:160px;}

  .standings-table{width:100%;border-collapse:collapse;background:#fff;border-radius:5px;overflow:hidden;font-size:13.5px;min-width:560px;}
  .standings-table th{background:var(--field-dark);color:var(--chalk);text-align:left;padding:10px 12px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;}
  .standings-table td{padding:9px 12px;border-bottom:1px solid #E3E7EC;color:var(--ink);}
  .standings-table tr:last-child td{border-bottom:none;}
  .standings-table tr.us{background:#FFF6DE;font-weight:700;}
  .standings-table tr.us td:first-child{border-left:3px solid var(--gold);}

  /* ---------- MODAL ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(13,31,23,0.65);display:flex;align-items:flex-start;justify-content:center;
    padding:40px 16px;z-index:100;overflow-y:auto;
  }
  .modal{background:var(--chalk);border-radius:6px;width:100%;max-width:560px;padding:26px 26px 22px;box-shadow:0 30px 60px rgba(0,0,0,0.4);}
  .modal h3{margin:0 0 16px;font-size:22px;color:var(--field-dark);}
  .modal-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:480px){.two-col{grid-template-columns:1fr;}}
  .field-group textarea{min-height:80px;resize:vertical;font-family:'Inter',sans-serif;}
  .close-x{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;color:var(--ink-soft);}
  .rel{position:relative;}
  .repeat-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center;}
  .repeat-row input{padding:9px 10px;}
  .add-row-btn{background:none;border:2px dashed #D7DCE2;border-radius:3px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--ink-soft);width:100%;}

  .helptext{font-size:12px;color:var(--ink-soft);margin-top:-6px;margin-bottom:10px;}
  footer.foot{text-align:center;padding:26px;color:var(--ink-soft);font-size:12px;font-family:'Space Mono',monospace;}
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--field-dark);color:#fff;
    padding:12px 22px;border-radius:30px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,0.3);
  }
  .loading-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--field-dark);color:var(--gold);font-family:'Space Mono',monospace;letter-spacing:2px;}
</style>
</head>

        </div>
      </div>`;
  } else {
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const col = 'teamhub';

    window.__fb = {
      async getDoc(key){
        const snap = await getDoc(doc(db, col, key));
        return snap.exists() ? snap.data().value : null;
      },
      async setDoc(key, value){
        await setDoc(doc(db, col, key), { value, updatedAt: Date.now() });
        return true;
      },
      watch(key, cb){
        return onSnapshot(doc(db, col, key), (snap)=>{
          cb(snap.exists() ? snap.data().value : null);
        }, (err)=> console.error('watch error for', key, err));
      }
    };
    window.boot();
  }
</script>

/* ============================ STORAGE HELPERS (Firestore) ============================ */
async function sGet(key){
  try{
    return await window.__fb.getDoc(key);
  }catch(e){ console.error('read failed for', key, e); return null; }
}
async function sSet(key, val){
  try{
    await window.__fb.setDoc(key, val);
    return true;
  }catch(e){ console.error('write failed for', key, e); return false; }
}

/* ============================ BOOT ============================ */
/* ============================ REMEMBER-FOR-TODAY SESSION ============================ */
// Keeps people from re-entering the password on every reload, but only until
// midnight — after that it expires and the gate shows again. This uses the
// browser's own localStorage, which is fine here since this page runs as a
// normal website (not inside Claude's artifact sandbox).
const SESSION_KEY = 'teamhub_session_v1';
function endOfTodayMs(){
  const d = new Date();
  d.setHours(23,59,59,999);
  return d.getTime();
}
function saveSession(unlocked, adminMode){
  try{
    localStorage.setItem(SESSION_KEY, JSON.stringify({ unlocked, adminMode, expiresAt: endOfTodayMs() }));
  }catch(e){ /* private browsing or storage disabled — session just won't persist */ }
}
function loadSession(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s.expiresAt || Date.now() > s.expiresAt){ localStorage.removeItem(SESSION_KEY); return null; }
    return s;
  }catch(e){ return null; }
}
function clearSession(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
}
function logOut(){
  clearSession();
  state.unlocked = false;
  state.adminMode = false;
  render();
}

async function boot(){
  const [config, events, standings, autoGamesDoc, off, def, st, scoutOff, scoutDef, resultsDoc] = await Promise.all([
    sGet('config'), sGet('events'), sGet('standings'), sGet('auto-games'),
    sGet('content-offense'), sGet('content-defense'), sGet('content-specialteams'),
    sGet('content-scoutingOffense'), sGet('content-scoutingDefense'), sGet('game-results')
  ]);
  state.config = config;
  state.events = events || [];
  state.standings = standings;
  state.autoGames = (autoGamesDoc && autoGamesDoc.games) || [];
  state.gameResults = (resultsDoc && resultsDoc.games) || [];
  state.content.offense = normalizeContent(off);
  state.content.defense = normalizeContent(def);
  state.content.specialteams = normalizeContent(st);
  state.content.scoutingOffense = normalizeContent(scoutOff);
  state.content.scoutingDefense = normalizeContent(scoutDef);
  if(config){
    const session = loadSession();
    if(session && session.unlocked){
      state.unlocked = true;
      state.adminMode = !!session.adminMode;
    }
  }
  state.booted = true;
  render();
  attachLiveSync();
  // First-run seed: if nobody has posted a scouting report yet, drop in the
  // Lehi Dalley offense breakdown so the section isn't empty on day one.
  // Only runs when the doc genuinely doesn't exist yet — never overwrites.
  if(config && !scoutOff){
    seedScoutingReport().catch(err=>console.error('Seed scouting report failed:', err));
  }
  // Idempotent per-opponent seed: append this week's opponent if they aren't
  // already in the scouting history, and feature them as the current week.
  // Safe to leave in indefinitely — it no-ops once the post exists.
  if(config){
    ensureOpponentScoutReport('scoutingOffense', 'LP Fonua', buildLPFonuaSeedPost).then(()=>{
      // Covers the case where the LP Fonua post was already created by an earlier
      // version of this file (before player-tracking existed) — patches just the
      // players array onto that existing post without touching anything else.
      return backfillOpponentPlayers('scoutingOffense', 'LP Fonua', buildLPFonuaSeedPost().players);
    }).catch(err=>console.error('LP Fonua seed failed:', err));
  }
}
window.boot = boot; // called by the Firebase module script once it's ready

async function ensureOpponentScoutReport(posKey, opponentName, buildPost){
  const c = state.content[posKey];
  if(!c) return;
  const already = (c.posts||[]).some(p => (p.opponent||'').trim().toLowerCase() === opponentName.toLowerCase());
  if(already) return;
  const post = buildPost();
  const nextContent = { posts: [...(c.posts||[]), post], currentPostId: post.id };
  const ok = await sSet('content-'+posKey, nextContent);
  if(ok){
    state.content[posKey] = nextContent;
    render();
  }
}

async function backfillOpponentPlayers(posKey, opponentName, playersData){
  const c = state.content[posKey];
  if(!c) return;
  const idx = (c.posts||[]).findIndex(p => (p.opponent||'').trim().toLowerCase() === opponentName.toLowerCase());
  if(idx < 0) return;
  const post = c.posts[idx];
  if(post.players && post.players.length) return; // already has player data, don't clobber manual edits
  const posts = [...c.posts];
  posts[idx] = {...post, players: playersData};
  const nextContent = {...c, posts};
  const ok = await sSet('content-'+posKey, nextContent);
  if(ok){
    state.content[posKey] = nextContent;
    render();
  }
}

async function submitSetup(e){
  e.preventDefault();
  const f = e.target;
  const btn = f.querySelector('button[type=submit]');
  const cfg = {
    teamName: f.teamName.value.trim() || 'Our Team',
    logoUrl: f.logoUrl.value.trim(),
    viewPassword: f.viewPassword.value,
    editPassword: f.editPassword.value,
    record: f.record.value.trim() || '0-0',
    standingText: f.standingText.value.trim() || 'TBD',
    links:{ rules:'', schedule:'', hudl:'', standings:'' }
  };
  if(!window.__fb){
    state.error = "Can't reach Firebase yet. Double-check the firebaseConfig values in the HTML file and that Firestore is enabled in your Firebase project, then reload.";
    render();
    return;
  }
  btn.disabled = true; btn.textContent = 'Creating…';
  render();
  try{
    const ok = await sSet('config', cfg);
    if(!ok){
      state.error = 'Could not save setup — Firestore did not confirm the write. Check your Firestore security rules allow writes, then try again.';
      render();
      return;
    }
    state.config = cfg;
    state.unlocked = true;
    state.adminMode = true;
    state.error = null;
    saveSession(true, true);
    showToast('Hub created — you are in Coach Mode.');
  } catch(err){
    console.error('Setup failed:', err);
    state.error = 'Something went wrong saving setup: ' + (err && err.message ? err.message : 'unknown error');
    render();
  }
}

    id: 'evt_'+Date.now(), type:'game', title:'', date:'', time:'', endTime:'', location:'', opponent:'', notes:''
  }};

async function submitEvent(e){
  e.preventDefault();
  const f = e.target;
  const btn = f.querySelector('button[type=submit]');
  const payload = state.modal.payload;
  const evt = {
    id: payload.id,
    type: f.type.value,
    date: f.date.value,
    time: f.time.value,
    endTime: f.endTime.value,
    opponent: f.opponent.value.trim(),
    location: f.location.value.trim(),
    notes: f.notes.value.trim(),
  };
  evt.title = evt.type === 'game' ? ('Game vs ' + (evt.opponent || 'TBD')) : 'Practice';
  const nextEvents = [...state.events];
  const idx = nextEvents.findIndex(x=>x.id===evt.id);
  if(idx>=0) nextEvents[idx] = evt; else nextEvents.push(evt);
  nextEvents.sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
  btn.disabled = true; btn.textContent = 'Saving…';
  render();
  try{
    const ok = await sSet('events', nextEvents);
    if(!ok){ state.error = 'Could not save — storage did not confirm the write.'; render(); return; }
    state.events = nextEvents;
    state.modal = null;
    showToast('Saved to schedule.');
  }catch(err){
    console.error('Event save failed:', err);
    state.error = 'Something went wrong saving this: ' + (err && err.message ? err.message : 'unknown error');
    render();
  }
}
async function deleteEvent(id){
  if(!confirm('Remove this from the schedule?')) return;

/* ============================ RECURRING PRACTICES ============================ */
const RECURRING_DAY_KEYS = ['sun','mon','tue','wed','thu','fri','sat'];
const RECURRING_DAY_LABELS = {sun:'Sunday',mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday',fri:'Friday',sat:'Saturday'};
function openRecurringModal(){
  state.modal = {type:'recurring', payload:{ startDate:'', endDate:'', location:'', notes:'' }};
  state.error = null;
  render();

async function submitRecurring(e){
  e.preventDefault();
  const f = e.target;
  const btn = f.querySelector('button[type=submit]');
  const startDate = f.startDate.value;
  const endDate = f.endDate.value;
  const location = f.location.value.trim();
  const notes = f.notes.value.trim();

  if(!startDate || !endDate){ state.error='Pick a start and end date.'; render(); return; }
  if(endDate < startDate){ state.error='The end date is before the start date.'; render(); return; }

  const dayConfig = {};
  let anyDay = false;
  RECURRING_DAY_KEYS.forEach(k=>{
    if(f['day_'+k].checked){
      anyDay = true;
      dayConfig[k] = { start: f['start_'+k].value, end: f['end_'+k].value };
    }
  });
  if(!anyDay){ state.error='Select at least one day of the week.'; render(); return; }

  const generated = [];
  let cur = new Date(startDate+'T00:00:00');
  const end = new Date(endDate+'T00:00:00');
  while(cur <= end){
    const dow = RECURRING_DAY_KEYS[cur.getDay()];
    if(dayConfig[dow]){
      const dateStr = `${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}-${String(cur.getDate()).padStart(2,'0')}`;
      generated.push({
        id: 'series_'+dateStr,
        type: 'practice',
        title: 'Practice',
        date: dateStr,
        time: dayConfig[dow].start || '',
        endTime: dayConfig[dow].end || '',
        opponent: '',
        location,
        notes,
      });
    }
    cur.setDate(cur.getDate()+1);
  }
  if(!generated.length){ state.error='No matching days landed inside that date range.'; render(); return; }

  const nextEvents = [...state.events];
  generated.forEach(g=>{
    const idx = nextEvents.findIndex(x=>x.id===g.id);
    if(idx>=0) nextEvents[idx] = g; else nextEvents.push(g);
  });
  nextEvents.sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));

  btn.disabled = true; btn.textContent = 'Adding…';
  render();
  try{
    const ok = await sSet('events', nextEvents);
    if(!ok){ state.error = 'Could not save — storage did not confirm the write.'; render(); return; }
    state.events = nextEvents;
    state.modal = null;
    showToast(`Added ${generated.length} practice${generated.length===1?'':'s'} to the schedule.`);
  }catch(err){
    console.error('Recurring save failed:', err);
    state.error = 'Something went wrong saving these: ' + (err && err.message ? err.message : 'unknown error');
    render();
  }
}

/* ============================ PREDICTIONS ENGINE ============================ */
// Simple, transparent rating system: each team's rating is its average
// scoring margin, adjusted by the strength of the opponents it played
// (an iterative "Simple Ranking System" — the same family of method used
// in college football rankings). It's recomputed fresh from state.gameResults
// on every render, so adding/editing results immediately updates every
// prediction on the page — no separate "recalculate" step needed.
const PRED_HOME_ADV = 2.5;   // estimated points a home team is worth in this method
const PRED_SIGMA = 14;       // assumed spread of HS football score margins, for win-probability

function teamKey(name){ return (name||'').trim().toLowerCase(); }

function computeRatings(games){
  const displayNames = {};
  const gamesByTeam = {};
  (games||[]).forEach(g=>{
    const kA = teamKey(g.teamA), kB = teamKey(g.teamB);
    if(!kA || !kB) return;
    if(!(kA in displayNames)) displayNames[kA] = g.teamA.trim();
    if(!(kB in displayNames)) displayNames[kB] = g.teamB.trim();
    (gamesByTeam[kA] = gamesByTeam[kA]||[]).push({opp:kB, margin:g.scoreA-g.scoreB});
    (gamesByTeam[kB] = gamesByTeam[kB]||[]).push({opp:kA, margin:g.scoreB-g.scoreA});
  });
  const teamList = Object.keys(displayNames);
  let ratings = {}; teamList.forEach(t=>ratings[t]=0);
  for(let iter=0; iter<30; iter++){
    const next = {};
    teamList.forEach(t=>{
      const gs = gamesByTeam[t]||[];
      next[t] = gs.length ? gs.reduce((s,g)=>s+g.margin+(ratings[g.opp]||0),0)/gs.length : 0;
    });
    const mean = teamList.length ? teamList.reduce((s,t)=>s+next[t],0)/teamList.length : 0;
    teamList.forEach(t=> next[t]-=mean);
    ratings = next;
  }
  const records = {};
  teamList.forEach(t=>{ records[t] = {w:0,l:0,t:0,gamesPlayed:0,marginSum:0}; });
  (games||[]).forEach(g=>{
    const kA = teamKey(g.teamA), kB = teamKey(g.teamB);
    if(!records[kA] || !records[kB]) return;
    const m = g.scoreA - g.scoreB;
    if(m>0){records[kA].w++; records[kB].l++;}
    else if(m<0){records[kA].l++; records[kB].w++;}
    else {records[kA].t++; records[kB].t++;}
    records[kA].gamesPlayed++; records[kB].gamesPlayed++;
    records[kA].marginSum += m; records[kB].marginSum -= m;
  });
  return { ratings, records, displayNames, teamList, gamesByTeam };
}

function erf(x){
  const sign = x<0?-1:1; x=Math.abs(x);
  const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
  const t=1/(1+p*x);
  const y=1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
  return sign*y;
}
function normalCdf(x){ return 0.5*(1+erf(x/Math.SQRT2)); }

// homeKey: teamKey of whichever side is at home, or null if unknown/neutral
function predictMatchup(model, nameA, nameB, homeKey){
  const kA = teamKey(nameA), kB = teamKey(nameB);
  if(!(kA in model.ratings) || !(kB in model.ratings)) return null;
  let margin = model.ratings[kA] - model.ratings[kB];
  if(homeKey===kA) margin += PRED_HOME_ADV;
  else if(homeKey===kB) margin -= PRED_HOME_ADV;
  const pA = normalCdf(margin/PRED_SIGMA);
  return { margin, pA, pB: 1-pA };
}

/* ============================ POSITION CONTENT ============================ */
// Content used to be stored as one "current" post plus an archive array.
// It's now a flat list of posts (any of which can be flagged "current"),
// so coaches can add, edit, or delete a post for any week — not just the
// latest one. normalizeContent() migrates old-shape data the first time
// it's read, so nothing already posted gets lost.
function normalizeContent(raw){
  if(!raw) return { posts: [], currentPostId: null };
  if(Array.isArray(raw.posts)) return raw; // already new shape
  if(raw.weekOf !== undefined || (raw.archive && raw.archive.length)){
    const posts = [];
    const baseTime = raw.updatedAt ? (Date.parse(raw.updatedAt) || Date.now()) : Date.now();
    if(raw.weekOf){
      posts.push({
        id: 'legacy_current', weekOf: raw.weekOf, lineup: raw.lineup||'', drills: raw.drills||'',
        notes: raw.notes||'', playbookLinks: raw.playbookLinks||[], videos: raw.videos||[], createdAt: baseTime,
      });
    }
    (raw.archive||[]).forEach((a,i)=>{
      posts.push({
        id: 'legacy_archive_'+i, weekOf: a.weekOf||'Untitled week', lineup: a.lineup||'', drills: a.drills||'',
        notes: a.notes||'', playbookLinks: a.playbookLinks||[], videos: a.videos||[], createdAt: baseTime-(i+1)*1000,
      });
    });
    return { posts, currentPostId: posts.length ? posts[0].id : null };
  }
  return { posts: [], currentPostId: null };
}
function getCurrentPost(posKey){
  const c = state.content[posKey];
  if(!c || !c.posts || !c.posts.length) return null;
  const pinned = c.posts.find(p=>p.id===c.currentPostId);
  if(pinned) return pinned;
  return [...c.posts].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0];
}
function otherPosts(posKey){
  const c = state.content[posKey];
  if(!c || !c.posts) return [];
  const current = getCurrentPost(posKey);
  return c.posts.filter(p=>p!==current).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
}

  };
  if(idx>=0) posts[idx]=toSave; else posts.push(toSave);
  const nextContent = { posts, currentPostId: makeCurrent ? p.id : (existingContent.currentPostId || (posts.length===1?p.id:null)) };

  btn.disabled = true; btn.textContent = 'Saving…';
  render();
  try{
    const ok = await sSet('content-'+posKey, nextContent);
    if(!ok){ state.error = 'Could not save — storage did not confirm the write.'; render(); return; }
    state.content[posKey] = nextContent;
    state.modal = null;
    showToast('Scouting report saved.');
  }catch(err){
    console.error('Scouting report save failed:', err);
    state.error = 'Something went wrong saving this: ' + (err && err.message ? err.message : 'unknown error');
    render();
  }
}


function embedUrlFor(url){
  if(!url) return null;
  url = url.trim();
  let m = url.match(/youtu\.be\/([A-Za-z0-9_-]+)/) || url.match(/[?&]v=([A-Za-z0-9_-]+)/) || url.match(/youtube\.com\/embed\/([A-Za-z0-9_-]+)/) || url.match(/youtube\.com\/shorts\/([A-Za-z0-9_-]+)/);
  if(m) return {kind:'iframe', src:'https://www.youtube.com/embed/'+m[1]};
  m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if(m) return {kind:'iframe', src:'https://player.vimeo.com/video/'+m[1]};
  m = url.match(/loom\.com\/(?:share|embed)\/([A-Za-z0-9]+)/);
  if(m) return {kind:'iframe', src:'https://www.loom.com/embed/'+m[1]};
  if(/\.(mp4|webm|mov)(\?.*)?$/i.test(url)) return {kind:'video', src:url};
  return {kind:'iframe', src:url};
}

// Google Drive "share" links (drive.google.com/file/d/ID/view) are a viewer
// PAGE, not the image itself — an <img> tag can't load them directly. This
// converts them (and the open?id= variant) to a URL that actually serves
// the raw image bytes. Non-Drive URLs pass through untouched.
function imageUrlFor(url){
  if(!url) return url;
  url = url.trim();
  let m = url.match(/drive\.google\.com\/file\/d\/([A-Za-z0-9_-]+)/);
  if(!m) m = url.match(/drive\.google\.com\/open\?id=([A-Za-z0-9_-]+)/);
  if(!m) m = url.match(/[?&]id=([A-Za-z0-9_-]+)/);
  if(m) return `https://lh3.googleusercontent.com/d/${m[1]}`;
  return url;
}
function handleImgError(img){
  if(img.dataset.fallbackShown) return;
  img.dataset.fallbackShown = '1';
  img.style.display = 'none';
  const holder = img.parentElement;
  if(holder){
    const div = document.createElement('div');
    div.className = 'img-broken';
    div.textContent = 'Photo unavailable — check the link';
    holder.appendChild(div);
  }
}

/* ============================ DATE HELPERS ============================ */
function fmtDate(d){ // d = 'YYYY-MM-DD'
  if(!d) return '';
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
}
function dayNum(d){ return new Date(d+'T00:00:00').getDate(); }
function monthAbbr(d){ return new Date(d+'T00:00:00').toLocaleDateString(undefined,{month:'short'}).toUpperCase(); }
function todayStr(){ const t=new Date(); return t.toISOString().slice(0,10); }
function fmt12h(t){
  if(!t) return '';
  const [hStr,mStr] = t.split(':');
  let h = parseInt(hStr,10);
  if(isNaN(h)) return t;
  const ampm = h>=12 ? 'PM':'AM';
  h = h % 12; if(h===0) h=12;
  return `${h}:${mStr} ${ampm}`;
}
function fmtTimeRange(time,endTime){
  if(!time) return '';
  if(!endTime) return fmt12h(time);
  return `${fmt12h(time)}–${fmt12h(endTime)}`;
}
function combinedEvents(){
  const auto = state.autoGames.map(g=>({
    id: g.id,
    type: 'game',
    date: g.date,
    time: g.time,
    opponent: g.opponent,
    title: 'Game vs ' + (g.opponent || 'TBD'),
    location: g.location || '',
    notes: (g.homeAway==='home' ? 'Home game' : 'Away game') + (g.week ? ' · '+g.week : ''),
    source: 'league',
  }));
  // Coach-entered events win if they share a date+opponent with an auto-imported one (e.g. time/location correction).
  const manualKeys = new Set(state.events.filter(e=>e.type==='game').map(e=>e.date+'|'+(e.opponent||'').toLowerCase()));
  const autoFiltered = auto.filter(g => !manualKeys.has(g.date+'|'+(g.opponent||'').toLowerCase()));
  return [...state.events, ...autoFiltered];
}
function upcomingEvents(){
  const t = todayStr();
  return combinedEvents().filter(e=>e.date>=t).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
}
function nextEvent(){ const u = upcomingEvents(); return u.length? u[0] : null; }
function nextGame(){ return upcomingEvents().find(e=>e.type==='game') || null; }
function nextPractice(){ return upcomingEvents().find(e=>e.type==='practice') || null; }

const OUR_TEAM_NAME = 'WL Moore';
// Pulls our record and standing straight from the last synced standings doc,
// so the Home page updates automatically the moment the scraper runs —
// no manual re-typing needed. Falls back to null if nothing's synced yet.
function deriveRecordAndStanding(){
  const st = state.standings;
  if(!st || !st.teams || !st.teams.length) return null;
  const idx = st.teams.findIndex(t => (t.team||'').trim().toLowerCase() === OUR_TEAM_NAME.toLowerCase());
  if(idx === -1) return null;
  const t = st.teams[idx];
  const w = t.w ?? 0, l = t.l ?? 0, ti = t.t ?? 0;
  const record = ti ? `${w}-${l}-${ti}` : `${w}-${l}`;
  const standing = `${idx+1} of ${st.teams.length}`;
  return { record, standing };
}

// --- small chart helpers, all hand-rolled divs so this stays a single static HTML file ---
function barRows(items, valueKey, labelKey, color){
  const max = Math.max(1, ...items.map(i=>Number(i[valueKey])||0));
  const total = items.reduce((s,i)=>s+(Number(i[valueKey])||0),0) || 1;
  return items.map(i=>{
    const v = Number(i[valueKey])||0;
    return `<div class="bar-row">
      <div class="bar-label">${escapeHtml(i[labelKey])}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round((v/max)*100)}%;background:${color};"></div></div>
      <div class="bar-value">${v} <span class="bar-pct">(${Math.round((v/total)*100)}%)</span></div>
    </div>`;
  }).join('');
}
function stackedRow(label, parts){ // parts: [{value, color, name}]
  const total = parts.reduce((s,p)=>s+(Number(p.value)||0),0) || 1;
  return `<div class="stacked-row">
    <div class="stacked-label">${escapeHtml(label)}</div>
    <div class="stacked-track">${parts.map(p=>{
      const v = Number(p.value)||0;
      return v>0 ? `<div class="stacked-seg" style="width:${(v/total*100).toFixed(1)}%;background:${p.color};" title="${escapeHtml(p.name)}: ${v}"></div>` : '';
    }).join('')}</div>
    <div class="stacked-total">${total}</div>
  </div>`;
}
function scoutLegend(items){ // items: [{color,label}]
  return `<div class="scout-legend">${items.map(i=>`<span class="scout-legend-item"><span class="scout-legend-dot" style="background:${i.color};"></span>${escapeHtml(i.label)}</span>`).join('')}</div>`;
}

function renderScoutWeekCard(c, plain, posKey, isCurrent){
  const L = scoutLabelsFor(posKey);
  const links = (c.playbookLinks||[]).filter(l=>l.url);
  const videos = (c.videos||[]).filter(v=>v.url);
  const rp = c.runPassByDown || [];
  const totalRun = rp.reduce((s,d)=>s+(d.run||0),0);
  const totalPass = rp.reduce((s,d)=>s+(d.pass||0),0);
  const totalSnaps = totalRun+totalPass;
  const formations = (c.formations||[]).slice().sort((a,b)=>b.count-a.count);
  const calls = (c.calls||[]).slice().sort((a,b)=>b.count-a.count);
  const strengthDir = c.strengthDir||[];
  const players = (c.players||[]).slice().sort((a,b)=>(b.touches||0)-(a.touches||0));
  const topFormation = formations[0];
  const topCall = calls[0];
  const keyLines = (c.keys||'').split('\n').map(s=>s.trim()).filter(Boolean);

  const adminBar = (posKey && state.adminMode) ? `
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
      <button class="btn btn-ghost btn-small" onclick="openScoutPostEdit('${posKey}', '${c.id}')">Edit</button>
      ${!isCurrent?`<button class="btn btn-ghost btn-small" onclick="setCurrentPost('${posKey}', '${c.id}')">Set as current week</button>`:''}
      <button class="btn btn-ghost btn-small" style="color:var(--error);border-color:#f0c9c9;" onclick="deleteContentPost('${posKey}', '${c.id}')">Delete</button>
    </div>` : '';

  return `
  <div class="${plain?'':'week-card'}">
    ${plain?'':'<div class="wk-eyebrow">This week</div>'}
    ${plain?'':`<h2>${escapeHtml(c.weekOf)}${c.opponent?` — vs ${escapeHtml(c.opponent)}`:''}</h2>`}
    ${adminBar}
    ${c.summary?`<div class="wk-block"><p style="white-space:pre-wrap;">${linkifyText(c.summary)}</p></div>`:''}

    ${totalSnaps ? `
    <div class="stat-strip">
      <div class="stat-card"><div class="stat-label">${L.splitStatLabel}</div><div class="stat-val">${Math.round(totalRun/totalSnaps*100)}% / ${Math.round(totalPass/totalSnaps*100)}%</div><div class="stat-sub">${totalRun} ${L.countNounA} · ${totalPass} ${L.countNounB}</div></div>
      ${topFormation?`<div class="stat-card"><div class="stat-label">${L.topFormationStatLabel}</div><div class="stat-val">${escapeHtml(topFormation.name)}</div><div class="stat-sub">${Math.round(topFormation.count/formations.reduce((s,f)=>s+f.count,0)*100)}% of tagged snaps</div></div>`:''}
      ${topCall?`<div class="stat-card"><div class="stat-label">${L.topCallStatLabel}</div><div class="stat-val">${escapeHtml(topCall.name)}</div><div class="stat-sub">${topCall.count} calls logged</div></div>`:''}
      <div class="stat-card"><div class="stat-label">Sample size</div><div class="stat-val">${totalSnaps}</div><div class="stat-sub">${L.sampleStatLabel}</div></div>
    </div>` : ''}

    <div class="wk-block"><h4>${L.downChartTitle}</h4>
      ${rp.length && totalSnaps ? `
        ${rp.map(d=>stackedRow(typeof d.down==='number'?`${d.down}${d.down===1?'st':d.down===2?'nd':d.down===3?'rd':'th'} Down`:'No Down Logged', [
          {value:d.run, color:'var(--rust)', name:L.kindA}, {value:d.pass, color:'var(--field)', name:L.kindB}
        ])).join('')}
        ${scoutLegend([{color:'var(--rust)',label:L.kindA},{color:'var(--field)',label:L.kindB}])}
      ` : `<div class="helptext" style="margin-top:0;">No counts entered yet for this section${posKey&&state.adminMode?` — click Edit above to fill in ${L.kindA.toLowerCase()}/${L.kindB.toLowerCase()} numbers by down.`:'.'}</div>`}
    </div>

    ${formations.length ? `
    <div class="wk-block"><h4>${L.formationsTitle}</h4>
      ${barRows(formations, 'count', 'name', 'var(--rust)')}
    </div>` : ''}

    ${calls.length ? `
    <div class="wk-block"><h4>${L.callsTitle}</h4>
      ${calls.map(x=>`<div class="bar-row">
        <div class="bar-label">${escapeHtml(x.name)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(x.count/Math.max(1,...calls.map(y=>y.count))*100)}%;background:${x.kind===L.kindB?'var(--field)':'var(--rust)'};"></div></div>
        <div class="bar-value">${x.count}</div>
      </div>`).join('')}
      ${scoutLegend([{color:'var(--rust)',label:L.kindALabel},{color:'var(--field)',label:L.kindBLabel}])}
    </div>` : ''}

    ${strengthDir.length ? `
    <div class="wk-block"><h4>${L.strengthTitle}</h4>
      ${strengthDir.map(x=>stackedRow(x.formation, [
        {value:x.withStr, color:'var(--rust)', name:L.strengthALabel},
        {value:x.middle, color:'var(--gold)', name:L.strengthBLabel},
        {value:x.away, color:'var(--field)', name:L.strengthCLabel},
      ])).join('')}
      ${scoutLegend([{color:'var(--rust)',label:L.strengthALabel},{color:'var(--gold)',label:L.strengthBLabel},{color:'var(--field)',label:L.strengthCLabel}])}
    </div>` : ''}

    ${players.length ? `
    <div class="wk-block"><h4>${L.playersTitle}</h4>
      ${barRows(players.map(x=>({name:`#${x.number}`, touches:x.touches})), 'touches', 'name', 'var(--rust)')}
      <div class="player-notes">
        ${players.map(x=>`<div class="player-note-row"><span class="player-note-num">#${escapeHtml(x.number)}</span><span class="player-note-role">${escapeHtml(x.role||'')}</span>${x.notes?`<div class="player-note-text">${linkifyText(x.notes)}</div>`:''}</div>`).join('')}
      </div>
    </div>` : ''}

    ${keyLines.length?`<div class="wk-block"><h4>${L.keysTitle}</h4><ul class="keys-list">${keyLines.map(k=>`<li>${linkifyText(k)}</li>`).join('')}</ul></div>`:''}

    ${links.length?`<div class="wk-block"><h4>Cutups & docs</h4>${links.map(l=>`<a class="plink" href="${escapeAttr(l.url)}" target="_blank" rel="noopener">📄 ${escapeHtml(l.label||'Open')}</a>`).join('')}</div>`:''}
    ${videos.length?`<div class="wk-block"><h4>Video</h4><div class="video-grid">${videos.map(v=>{
      const em = embedUrlFor(v.url);
      const player = em.kind==='video' ? `<video src="${escapeAttr(em.src)}" controls></video>` : `<iframe src="${escapeAttr(em.src)}" allowfullscreen></iframe>`;
      return `<div class="video-box">${player}<div class="video-title">${escapeHtml(v.title||'Video')}</div></div>`;
    }).join('')}</div></div>`:''}
    ${c.notes?`<div class="wk-block"><h4>Coach notes</h4><p style="white-space:pre-wrap;">${linkifyText(c.notes)}</p></div>`:''}
  </div>`;
}

function renderPredictions(){
  const games = state.gameResults || [];
  const model = computeRatings(games);
  const hasData = model.teamList.length > 0;

  const rankedTeams = model.teamList.slice().sort((a,b)=>model.ratings[b]-model.ratings[a]);
  const ourKey = teamKey(OUR_TEAM_NAME);

  // Our upcoming games, pulled straight from the schedule
  const upcoming = upcomingEvents().filter(e=>e.type==='game').slice(0,5);

  const upcomingHtml = upcoming.length ? upcoming.map(e=>{
    const isHome = (e.notes||'').includes('Home game');
    const isAway = (e.notes||'').includes('Away game');
    const homeKey = isHome ? ourKey : (isAway ? teamKey(e.opponent) : null);
    const pred = predictMatchup(model, OUR_TEAM_NAME, e.opponent, homeKey);
    return `<div class="pred-card">
      <div class="pred-card-head">
        <div class="pred-teams">${escapeHtml(OUR_TEAM_NAME)} <span class="pred-vs">vs</span> ${escapeHtml(e.opponent||'TBD')}</div>
        <div class="pred-date">${fmtDateShort(e.date)}${isHome?' · Home':isAway?' · Away':''}</div>
      </div>
      ${pred ? `
        <div class="pred-bar-row">
          <div class="pred-bar-track"><div class="pred-bar-fill" style="width:${(pred.pA*100).toFixed(0)}%;"></div></div>
        </div>
        <div class="pred-pct-row">
          <span class="${pred.pA>=0.5?'pred-fav':''}">${escapeHtml(OUR_TEAM_NAME)}: ${(pred.pA*100).toFixed(0)}%</span>
          <span class="${pred.pB>0.5?'pred-fav':''}">${escapeHtml(e.opponent)}: ${(pred.pB*100).toFixed(0)}%</span>
        </div>
        <div class="pred-margin">Projected: ${escapeHtml(pred.margin>=0?OUR_TEAM_NAME:e.opponent)} by ${Math.abs(pred.margin).toFixed(1)}</div>
      ` : `<div class="helptext" style="margin-top:8px;">Not enough results logged yet for ${escapeHtml(e.opponent||'this opponent')} — add their scores below to get a prediction.</div>`}
    </div>`;
  }).join('') : `<div class="empty-state">No games on the schedule yet.</div>`;

  const rankingsHtml = hasData ? `
  <table class="rank-table">
    <thead><tr><th>#</th><th>Team</th><th>Rating</th><th>Record</th><th>Avg margin</th></tr></thead>
    <tbody>
      ${rankedTeams.map((k,i)=>{
        const r = model.records[k] || {w:0,l:0,t:0,gamesPlayed:0,marginSum:0};
        const avg = r.gamesPlayed ? r.marginSum/r.gamesPlayed : 0;
        const isUs = k===ourKey;
        return `<tr class="${isUs?'rank-row-us':''}">
          <td>${i+1}</td>
          <td>${escapeHtml(model.displayNames[k])}${isUs?' <span class="rank-us-tag">US</span>':''}</td>
          <td>${model.ratings[k]>=0?'+':''}${model.ratings[k].toFixed(1)}</td>
          <td>${r.w}-${r.l}${r.t?`-${r.t}`:''}</td>
          <td>${avg>=0?'+':''}${avg.toFixed(1)}</td>
        </tr>`;
      }).join('')}
    </tbody>
  </table>` : `<div class="empty-state">No game results synced yet. ${state.adminMode?'Run the "Sync league standings, schedule &amp; results" GitHub Action (Actions tab \u2192 Run workflow) to pull results automatically, or add them manually below.':'Check back soon.'}</div>`;

  const teamOptions = model.teamList.slice().sort((a,b)=>model.displayNames[a].localeCompare(model.displayNames[b]))
    .map(k=>`<option value="${escapeAttr(k)}">${escapeHtml(model.displayNames[k])}</option>`).join('');

  return `
  <div class="section-head">
    <h2>Predictions</h2>
    <span class="sub">visible to coaches only</span>
  </div>
  <div class="pred-disclaimer">Built from league scores synced automatically from the UYFC schedule page, using a simple margin-of-victory model (like a power ranking) — not a guarantee. Treat this as one more data point for game-planning, not a substitute for scouting.</div>

  <div class="section-head"><h3 style="font-size:17px;margin:0;">Our upcoming games</h3></div>
  <div class="pred-card-grid">${upcomingHtml}</div>

  <div class="section-head" style="margin-top:26px;">
    <h3 style="font-size:17px;margin:0;">Power rankings</h3>
    ${state.adminMode?`<button class="btn btn-ghost btn-small" onclick="openGameResultsModal()">${games.length?'Edit / override results':'+ Add results manually'}</button>`:''}
  </div>
  ${rankingsHtml}

  ${hasData ? `
  <div class="section-head" style="margin-top:26px;"><h3 style="font-size:17px;margin:0;">Matchup explorer</h3></div>
  <div class="matchup-explorer">
    <select id="matchupA">${teamOptions}</select>
    <span class="pred-vs">vs</span>
    <select id="matchupB">${teamOptions}</select>
    <button class="btn btn-gold btn-small" onclick="runMatchupExplorer()">Predict</button>
  </div>
  <div id="matchupResult"></div>
  ` : ''}

  <div class="section-head" style="margin-top:26px;"><h3 style="font-size:17px;margin:0;">Logged results (${games.length})</h3></div>
  ${games.length ? `
  <table class="rank-table">
    <thead><tr><th>Matchup</th><th>Score</th><th>Week</th></tr></thead>
    <tbody>
      ${games.map(g=>`<tr>
        <td>${escapeHtml(g.teamA)} vs ${escapeHtml(g.teamB)}</td>
        <td>${g.scoreA}–${g.scoreB}</td>
        <td>${escapeHtml(g.label||'')}</td>
      </tr>`).join('')}
    </tbody>
  </table>` : `<div class="empty-state">Nothing logged yet.</div>`}
  `;
}
function fmtDateShort(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return dateStr;
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
function runMatchupExplorer(){
  const games = state.gameResults || [];
  const model = computeRatings(games);
  const kA = document.getElementById('matchupA').value;
  const kB = document.getElementById('matchupB').value;
  const box = document.getElementById('matchupResult');
  if(kA===kB){ box.innerHTML = `<div class="helptext">Pick two different teams.</div>`; return; }
  const pred = predictMatchup(model, model.displayNames[kA], model.displayNames[kB], null);
  if(!pred){ box.innerHTML = `<div class="helptext">Not enough data for one of these teams.</div>`; return; }
  const favKey = pred.margin>=0 ? kA : kB;
  box.innerHTML = `<div class="pred-card" style="margin-top:14px;">
    <div class="pred-bar-row"><div class="pred-bar-track"><div class="pred-bar-fill" style="width:${(pred.pA*100).toFixed(0)}%;"></div></div></div>
    <div class="pred-pct-row">
      <span class="${pred.pA>=0.5?'pred-fav':''}">${escapeHtml(model.displayNames[kA])}: ${(pred.pA*100).toFixed(0)}%</span>
      <span class="${pred.pB>0.5?'pred-fav':''}">${escapeHtml(model.displayNames[kB])}: ${(pred.pB*100).toFixed(0)}%</span>
    </div>
    <div class="pred-margin">Projected: ${escapeHtml(model.displayNames[favKey])} by ${Math.abs(pred.margin).toFixed(1)}</div>
  </div>`;
}

          <td>${escapeHtml(tm.pct||'')}</td>
          <td>${escapeHtml(tm.streak||'')}</td>
          <td>${escapeHtml(tm.coach||'')}</td>
        </tr>`).join('')}
      </tbody>
    </table>
    </div>
  ` : `<div class="empty-state">No standings synced yet. ${state.adminMode?'Run the "Sync league standings, schedule &amp; results" GitHub Action (Actions tab \u2192 Run workflow), or add standings manually below.':'Check back soon.'}</div>`}
  `;
}
function timeAgo(ms){
  if(!ms) return 'a while ago';
  const mins = Math.round((Date.now()-ms)/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins+' min ago';
  const hrs = Math.round(mins/60);
  if(hrs < 24) return hrs+' hr ago';
  const days = Math.round(hrs/24);
  return days+' day'+(days===1?'':'s')+' ago';
}

/* ============================ UTIL ============================ */
function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function escapeAttr(str){ return escapeHtml(str); }

// Turns plain-text URLs typed into a post (lineup, drills, notes, etc.) into
// real clickable links. Escapes everything else, so this is safe to use
// anywhere escapeHtml() was used on free-text — just swap the call.
function linkifyText(raw){
  if(raw===undefined||raw===null||raw==='') return '';
  const text = String(raw);
  const urlRe = /(https?:\/\/[^\s<>"')\]]+|www\.[^\s<>"')\]]+)/gi;
  let out = '';
  let lastIndex = 0;
  let m;
  while((m = urlRe.exec(text))){
    out += escapeHtml(text.slice(lastIndex, m.index));
    let url = m[0];
    // Strip common trailing punctuation that's usually sentence punctuation,
    // not part of the link (e.g. "check the playbook: https://x.com/doc.")
    let trailing = '';
    const trailMatch = url.match(/[.,;:!?]+$/);
    if(trailMatch){
      trailing = trailMatch[0];
      url = url.slice(0, url.length - trailing.length);
    }
    if(!url){ out += escapeHtml(m[0]); lastIndex = urlRe.lastIndex; continue; }
    const href = /^www\./i.test(url) ? 'https://'+url : url;
    out += `<a href="${escapeAttr(href)}" target="_blank" rel="noopener" style="color:var(--rust);text-decoration:underline;word-break:break-all;">${escapeHtml(url)}</a>`;
    out += escapeHtml(trailing);
    lastIndex = urlRe.lastIndex;
  }
  out += escapeHtml(text.slice(lastIndex));
  return out;
}
